<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流影</title>
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="traffic">
        <button class="tl close" id="btnClose" title="关闭"></button>
        <button class="tl min" id="btnMin" title="最小化"></button>
        <button class="tl zoom" id="btnZoom" title="缩放"></button>
      </div>
      <div class="title-drag pywebview-drag-region">
        <img class="mark" src="icon.png" alt="" />
        <div class="brand">
          <strong>流影</strong>
          <span>HLS · 多线程下载</span>
        </div>
      </div>
    </header>

    <main>
      <section class="card composer">
        <div class="card-head">
          <h1>新的下载</h1>
          <p>支持 <code>第01集$链接</code>。剧集请填写剧名，会自动建文件夹。</p>
        </div>
        <textarea id="urls" placeholder="第01集$https://example.com/ep01.m3u8
第02集$https://example.com/ep02.m3u8"></textarea>
        <label class="name-field">
          剧名 / 文件夹
          <input id="filename" type="text" maxlength="80" placeholder="例如 九门。多集会保存到「下载目录/九门/第01集.mp4」" />
        </label>

        <div class="prefs" id="headersPanel" hidden>
          <label>
            User-Agent
            <input id="ua" type="text" spellcheck="false" />
          </label>
          <label>
            Referer
            <input id="referer" type="text" spellcheck="false" placeholder="可选，用于防盗链" />
          </label>
        </div>

        <div class="toolbar">
          <button class="path" id="btnFolder" title="选择保存位置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.4 1.6H20.5v9.4H3.5V7.5Z" /></svg>
            <span id="folderLabel">下载文件夹</span>
          </button>
          <label class="step">
            同时
            <input id="taskWorkers" type="number" min="1" max="8" value="3" />
          </label>
          <label class="step">
            线程
            <input id="segWorkers" type="number" min="1" max="64" value="16" />
          </label>
          <button class="ghost" id="btnHeaders">请求头</button>
          <button class="primary" id="btnStart">开始下载</button>
        </div>
        <p class="hint" id="hint"></p>
      </section>

      <section class="queue">
        <div class="queue-head">
          <h2>任务</h2>
          <span id="queueMeta"></span>
        </div>
        <div id="empty" class="empty">
          <div class="empty-orb"></div>
          <p>还没有任务</p>
          <span>粘贴链接后点开始，分片会并行拉取，再用 ffmpeg 合成 MP4。</span>
        </div>
        <div id="tasks" class="tasks"></div>
      </section>
    </main>
  </div>

  <div id="confirm" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">取消下载？</h3>
      <p>
        <span id="confirmPrefix">将删除「</span><strong id="confirmName"></strong><span id="confirmSuffix">」已下载的分片和未完成文件，此操作无法恢复。</span>
      </p>
      <div class="sheet-actions">
        <button type="button" id="confirmNo">再想想</button>
        <button type="button" class="danger" id="confirmYes">删除并取消</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
