<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流影</title>
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="traffic">
        <button class="tl close" id="btnClose" title="关闭"></button>
        <button class="tl min" id="btnMin" title="最小化"></button>
        <button class="tl zoom" id="btnZoom" title="缩放"></button>
      </div>
      <div class="title-drag pywebview-drag-region">
        <img class="mark" src="icon.png" alt="" />
        <div class="brand">
          <strong>流影</strong>
          <div class="brand-sub">
            <span>HLS · 多线程下载</span>
            <span class="brand-dot">·</span>
            <span class="brand-meta">
              by wpf900 ·
              <a
                class="brand-github pywebview-no-drag"
                href="https://github.com/wpf900/m3u_down"
                title="GitHub 仓库"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                </svg>
              </a>
            </span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="card composer">
        <div class="card-head">
          <h1>新的下载</h1>
          <p>支持 <code>第01集$链接</code>。剧集请填写剧名，会自动建文件夹。</p>
        </div>
        <textarea id="urls" placeholder="第01集$https://example.com/ep01.m3u8
第02集$https://example.com/ep02.m3u8"></textarea>
        <label class="name-field">
          剧名 / 文件夹
          <input id="filename" type="text" maxlength="80" placeholder="例如 xxx。多集会保存到「下载目录/xxx/第01集.mp4」" />
        </label>

        <div class="prefs" id="headersPanel" hidden>
          <label>
            User-Agent
            <input id="ua" type="text" spellcheck="false" />
          </label>
          <label>
            Referer
            <input id="referer" type="text" spellcheck="false" placeholder="可选，用于防盗链" />
          </label>
        </div>

        <div class="toolbar">
          <button class="path" id="btnFolder" title="选择保存位置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.4 1.6H20.5v9.4H3.5V7.5Z" /></svg>
            <span id="folderLabel">下载文件夹</span>
          </button>
          <label class="step">
            同时
            <input id="taskWorkers" type="number" min="1" max="8" value="3" />
          </label>
          <label class="step">
            线程
            <input id="segWorkers" type="number" min="1" max="64" value="16" />
          </label>
          <button class="ghost surface-btn" id="btnHeaders">请求头</button>
          <button class="primary" id="btnStart">开始下载</button>
        </div>
        <p class="hint" id="hint"></p>
      </section>

      <section class="queue">
        <div class="queue-head">
          <div class="task-tabs" role="tablist" aria-label="任务列表">
            <button type="button" class="task-tab active" id="tabActive" role="tab" aria-selected="true" aria-controls="panelActive">任务</button>
            <button type="button" class="task-tab" id="tabHistory" role="tab" aria-selected="false" aria-controls="panelHistory">
              历史
              <span class="tab-badge" id="historyBadge" hidden>0</span>
            </button>
          </div>
          <span id="queueMeta"></span>
          <span id="historyMeta" hidden></span>
          <button type="button" class="ghost select-toggle" id="btnSelectMode">多选</button>
        </div>

        <div class="batch-bar" id="batchBar" hidden>
          <label class="batch-all">
            <input type="checkbox" id="selectAll" />
            <span>全选</span>
          </label>
          <span class="batch-count" id="selectedCount">已选 0</span>
          <div class="batch-actions">
            <button type="button" class="text-btn" id="batchPause" hidden>暂停</button>
            <button type="button" class="text-btn" id="batchResume" hidden>继续</button>
            <button type="button" class="text-btn" id="batchRetry" hidden>重试</button>
            <button type="button" class="text-btn danger-text" id="batchCancel" hidden>取消</button>
            <button type="button" class="text-btn danger-text" id="batchRemove">删除</button>
          </div>
        </div>

        <div id="panelActive" class="task-panel" role="tabpanel" aria-labelledby="tabActive">
          <div id="empty" class="empty">
            <div class="empty-orb"></div>
            <p>还没有任务</p>
            <span>粘贴链接后点开始，分片会并行拉取，再用 ffmpeg 合成 MP4。</span>
          </div>
          <div id="tasks" class="tasks"></div>
        </div>

        <div id="panelHistory" class="task-panel" role="tabpanel" aria-labelledby="tabHistory" hidden>
          <div class="history-search" id="historySearchWrap" hidden>
            <input id="historySearch" type="search" placeholder="搜索剧名或视频名称" spellcheck="false" autocomplete="off" />
            <button type="button" class="ghost" id="historySearchClear" hidden>清除</button>
          </div>
          <div id="historyEmpty" class="empty" hidden>
            <div class="empty-orb"></div>
            <p>暂无历史记录</p>
            <span>已完成、失败或取消的任务会归档到这里。</span>
          </div>
          <div id="historySearchEmpty" class="empty" hidden>
            <p>没有匹配的记录</p>
            <span>试试其他剧名或视频名称。</span>
          </div>
          <div id="history" class="history-groups"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="confirm" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">取消下载？</h3>
      <p id="confirmText">
        <span id="confirmPrefix">将删除「</span><strong id="confirmName"></strong><span id="confirmSuffix">」已下载的分片和未完成文件，此操作无法恢复。</span>
      </p>
      <div class="sheet-actions">
        <button type="button" id="confirmNo">再想想</button>
        <button type="button" class="danger" id="confirmYes">删除并取消</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
