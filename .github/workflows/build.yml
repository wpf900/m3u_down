name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 v1.0.0。留空则只上传 Artifacts，不出现在 Releases"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 流影 ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}

  package:
    needs: prepare-release
    if: always() && !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Liuying-windows-x64
          - os: macos-15
            artifact: Liuying-macos-arm64
          - os: macos-13
            artifact: Liuying-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/build.py

      - name: Stage Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Liuying -DestinationPath ${{ matrix.artifact }}.zip

      - name: Stage macOS zip
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/Liuying.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: needs.prepare-release.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: ${{ matrix.artifact }}.zip
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
