name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 v1.0.0。留空则只上传 Artifacts，不出现在 Releases"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Liuying-windows-x64
          - os: macos-15
            artifact: Liuying-macos-arm64
          - os: macos-13
            artifact: Liuying-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/build.py

      - name: Stage Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Liuying -DestinationPath ${{ matrix.artifact }}.zip

      - name: Stage macOS zip
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/Liuying.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: package
    if: >-
      success() &&
      (github.ref_type == 'tag' || inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Liuying-*
          path: artifacts
          merge-multiple: false

      - name: Collect zip files
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: 流影 ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
